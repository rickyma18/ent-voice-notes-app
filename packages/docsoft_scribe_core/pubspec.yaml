name: docsoft_scribe_core
description: Dart-only core package for DocSoft Scribe pipeline. Contains medicalization, extraction, and composition logic without Flutter dependencies.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  path: ^1.8.0
  equatable: ^2.0.5
  freezed_annotation: ^3.0.0
  json_annotation: ^4.8.1

dev_dependencies:
  test: ^1.24.0
  build_runner: ^2.4.0
  freezed: ^3.0.6
  json_serializable: ^6.7.1
