# services/pyannote-diarization/docker-compose.yml

version: '3.8'

services:
  pyannote-diarization:
    build: .
    container_name: pyannote-diarization
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
